# Builds Snit and runs the tests on GitHub's Windows machines after every push.
# The result shows up as a green tick (or red cross) next to each commit.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # FFmpeg lets the media tests run too (they are skipped without it).
      - name: Install FFmpeg
        run: choco install ffmpeg --no-progress -y

      - name: Build
        run: dotnet build Snit.slnx --configuration Release

      - name: Test
        run: dotnet test Snit.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      # If a test fails, show its name and message right on the GitHub page.
      - name: Show failed tests
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter results.trx | ForEach-Object {
            [xml]$results = Get-Content $_.FullName
            $results.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed' | ForEach-Object {
              $message = ($_.Output.ErrorInfo.Message -replace "`r?`n", ' ')
              Write-Output "::error title=$($_.testName)::$message"
            }
          }
