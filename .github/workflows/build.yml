# Builds Snit and runs the tests on GitHub's Windows machines after every push.
# The result shows up as a green tick (or red cross) next to each commit.
name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # FFmpeg lets the media tests run too (they are skipped without it).
      # We use the plain ffmpeg.exe (like winget installs), not Chocolatey's launcher,
      # which starts ffmpeg as a separate program that can't be stopped the normal way.
      - name: Install FFmpeg
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $bin = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Add-Content $env:GITHUB_PATH $bin
          & "$bin\ffmpeg.exe" -hide_banner -version | Select-Object -First 1

      - name: Build
        run: dotnet build Snit.slnx --configuration Release

      - name: Test
        run: dotnet test Snit.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      # If a test fails, show its name and message right on the GitHub page.
      - name: Show failed tests
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter results.trx | ForEach-Object {
            [xml]$results = Get-Content $_.FullName
            $results.TestRun.Results.UnitTestResult | Where-Object outcome -eq 'Failed' | ForEach-Object {
              $message = ($_.Output.ErrorInfo.Message -replace "`r?`n", ' ')
              Write-Output "::error title=$($_.testName)::$message"
            }
          }
